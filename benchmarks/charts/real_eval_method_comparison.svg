<svg xmlns="http://www.w3.org/2000/svg" width="860" height="358" viewBox="0 0 860 358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="860" height="358" fill="#ffffff"/>
