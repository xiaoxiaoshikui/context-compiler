<svg xmlns="http://www.w3.org/2000/svg" width="860" height="622" viewBox="0 0 860 622" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="860" height="622" fill="#ffffff"/>
<text x="200" y="27" font-size="16.5" font-weight="600" fill="#111827">Oracle ceiling vs Random floor vs Ours, at a fixed 8,000-token budget</text>
<text x="200" y="46" font-size="12" fill="#4b5563">Same 6 tasks, same budget, same model -- only how the context was chosen differs. Every 'Ours' stage is</text>
<text x="200" y="62" font-size="12" fill="#4b5563">a real, verified bug fix (see benchmarks/README.md), shown in full rather than a single before/after</text>
<text x="200" y="78" font-size="12" fill="#4b5563">pair. Repeats shown as separate bars -- a real model is stochastic, n=2 per stage is not enough to</text>
<text x="200" y="94" font-size="12" fill="#4b5563">separate luck from signal, and the run-to-run noise visible here is itself part of the honest result.</text>
<text x="200" y="110" font-size="12" fill="#4b5563">Higher = better.</text>
