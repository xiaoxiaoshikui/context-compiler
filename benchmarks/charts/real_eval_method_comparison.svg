<svg xmlns="http://www.w3.org/2000/svg" width="860" height="452" viewBox="0 0 860 452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="860" height="452" fill="#ffffff"/>
<text x="200" y="27" font-size="16.5" font-weight="600" fill="#111827">Oracle ceiling vs Random floor vs Ours, at a fixed 8,000-token budget</text>
<text x="200" y="46" font-size="12" fill="#4b5563">Same 6 tasks, same budget, same model -- only how the context was chosen differs. 'Ours (before)'</text>
<text x="200" y="62" font-size="12" fill="#4b5563">spread the budget over many low-fidelity items; 'Ours (after)' forces the top-3 candidates to full text</text>
<text x="200" y="78" font-size="12" fill="#4b5563">first (top_k_full_text). Repeats shown as separate bars -- a real model is stochastic, n=2 is not</text>
<text x="200" y="94" font-size="12" fill="#4b5563">enough to separate luck from signal. Higher = better.</text>
